{{define "admin_container"}}
<div class="admin-container container-fluid px-3 px-md-4 pt-5 pb-4 py-md-5">
    <h1 class="display-5 fw-bold mb-4 mb-md-5">User Management</h1>
    <div class="table-responsive">
        <table class="table table-striped align-middle mb-0">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Name</th>
                    <th scope="col">Email</th>
                    <th scope="col">Role</th>
                    <th scope="col" colspan="2">Actions</th>
                </tr>
            </thead>
            <tbody>
                {{range $index, $user := .}}
                <tr>
                    <th scope="row">{{$index}}</th>
                    <td>{{$user.FullName}}</td>
                    <td>{{$user.Email}}</td>
                    <td>{{$user.AppRole}}</td>
                    <td>
                        {{if $user.Enabled}}
                        <button class="btn btn-warning btn-sm text-nowrap" hx-patch="/admin/{{$user.Id}}/disable"
                            hx-target="#usersContainer" hx-indicator="#loadingIndicator">
                            Disable
                        </button>
                        {{else}}
                        <button class="btn btn-success btn-sm text-nowrap" hx-patch="/admin/{{$user.Id}}/enable"
                            hx-target="#usersContainer" hx-indicator="#loadingIndicator">
                            Enable
                        </button>
                        {{end}}
                    </td>
                    <td>
                        <button class="btn btn-danger btn-sm text-nowrap" hx-delete="/admin/{{$user.Id}}"
                            hx-target="#usersContainer" hx-confirm="Are you sure you want to delete '{{$user.Email}}'?"
                            hx-indicator="#loadingIndicator">
                            Delete
                        </button>
                        <!-- 
                        {{template "delete_button" .}} -->
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</div>
{{end}}
