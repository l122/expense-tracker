{{define "new_expense"}}
<style>
    #sandwich_menu {
        display: none !important;
    }
    /* On mobile, make the container fill the screen height and push calculator to the bottom */
    @media (max-width: 768px) {
        .expense-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
    }
    /* Visual feedback matching calculator buttons when tapped or held */
    #backspace-btn {
        transition:
            background-color 0.1s ease,
            transform 0.08s ease;
        user-select: none;
        -webkit-user-select: none;
    }
    #backspace-btn:active,
    #backspace-btn.is-pressed {
        background-color: #e9ecef !important;
        transform: scale(0.95);
    }
</style>

<div class="container py-3 expense-container" style="max-width: 480px">
    <div>
        <div
            class="d-flex align-items-center justify-content-between pt-3 mb-4 position-relative"
        >
            <div>{{template "return-button" .ReturnUrl}}</div>
            <h5
                class="mb-0 fw-semibold position-absolute start-50 translate-middle-x"
            >
                New expense
            </h5>
            <div style="width: 24px"></div>
        </div>

        <form id="expense-form">
            <input type="hidden" name="return_url" value="{{.ReturnUrl}}" />
            <input type="hidden" id="expense_date_iso" name="expense_date" />
            <!-- Wrapper with even vertical spacing (gap-3) between Date Picker, Amount, and Note -->
            <div class="d-flex flex-column gap-3 mb-4">
                <!-- Date Picker -->
                <div class="mt-2">{{template "date-picker"}}</div>

                <!-- Amount Row: Currency + Decimal Input + Backspace Button -->
                <div
                    class="input-group input-group-lg shadow-sm rounded-3 overflow-hidden border"
                >
                    <span
                        class="input-group-text bg-white fw-bold text-muted border-0 px-3"
                        >USD</span
                    >
                    <input
                        type="text"
                        inputmode="numeric"
                        id="amount-input"
                        name="amount"
                        class="form-control text-end fw-bold fs-3 border-0 bg-white"
                        placeholder="0"
                        readonly
                    />
                    <button
                        type="button"
                        id="backspace-btn"
                        class="btn btn-light border-0 bg-white text-dark px-3"
                        aria-label="Erase last digit"
                    >
                        ⌫
                    </button>
                </div>

                <!-- Note Input -->
                <div>
                    <input
                        type="text"
                        name="notes"
                        class="form-control form-control-lg shadow-sm"
                        placeholder="Add a note..."
                    />
                </div>
            </div>
        </form>
    </div>

    <!-- Bottom Section: Calculator & Action Button -->
    <div class="pb-3">
        <!-- Reused Calculator Template -->
        {{template "calculator"}}

        <!-- Wide Bottom Action Button / Category Display -->
        <div class="d-grid mt-3">
            <button
                type="button"
                class="btn btn-primary btn-lg py-3 fw-semibold shadow-sm"
                hx-post="/category/select"
                hx-include="#expense-form"
                hx-target="#main_page"
            >
                Choose category
            </button>
        </div>
    </div>
</div>

{{template "expense-scripts"}} {{end}}
