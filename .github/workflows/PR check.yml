name: PR check

on:
  pull_request:
    types:
      - opened
    branches:
      - 'main'
    paths:
      - '**.go'
      - '**.mod'
      - '**.sum'
      - '**.templ'
      - '**.html'
      - '**.css'
      - '**.js'

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6.3.0
      with:
        go-version-file: 'go.mod'

    - name: Display Go version
      run: go version

    - name: Install templ
      run: go install github.com/a-h/templ/cmd/templ@v0.3.1001

    - name: Generate templ files
      run: templ generate

    - name: Test
      run: go test -v ./...
      
    - name: Build
      run: go build -v ./...

