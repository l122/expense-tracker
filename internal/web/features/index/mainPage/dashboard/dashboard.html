{{define "dashboard"}}
<div class="container-fluid px-3 px-md-4 pt-5 pb-4 py-md-5">
    <div class="card shadow-lg border-0">
        <div class="card-body p-3 p-md-4">
            {{if .}}
            <ul class="list-group list-group-flush">
                {{range .}}
                <li class="list-group-item list-group-item-action d-flex justify-content-between align-items-center px-2 py-3"
                    role="button" hx-get="/category/{{.Id}}/expenses" hx-target="#main_page"
                    hx-indicator="#loading-indicator">
                    <div class="d-flex align-items-center gap-3">
                        {{if .Icon}}
                        <span class="fs-4">{{.Icon}}</span>
                        {{end}}
                        <span class="fw-semibold">{{.Name}}</span>
                    </div>
                    <span class="fw-bold text-nowrap">$100.00</span>
                </li>
                {{end}}
            </ul>
            {{end}}
        </div>
    </div>
</div>
{{end}}
