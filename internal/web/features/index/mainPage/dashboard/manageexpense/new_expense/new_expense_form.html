{{define "new_expense_form"}}
<form id="expense-form">
    <input type="hidden" name="return_url" value="{{.ReturnUrl}}" />
    <input type="hidden" id="expense_date_iso" name="expense_date" />
    <div class="d-flex flex-column gap-3 mb-4">
        {{if .Expense.Id}}
            <input type="hidden" name="id" value="{{.Expense.Id}}">
        {{end}}
        <div class="mt-2">{{template "date-picker" .}}</div>
        <div
            id="amount-group"
            class="input-group input-group-lg shadow-sm rounded-3 overflow-hidden border"
        >
            <span
                class="input-group-text bg-white fw-bold text-muted border-0 px-3"
                >USD</span
            >
            <input
                type="text"
                inputmode="numeric"
                id="amount-input"
                name="amount"
                class="form-control text-end fw-bold fs-3 border-0 bg-white"
                placeholder="0"
                value="{{if .Expense.Amount}}{{.Expense.Amount}}{{end}}"
                readonly
            />
            <button
                type="button"
                id="backspace-btn"
                class="btn btn-light border-0 bg-white text-dark px-3"
                aria-label="Erase last digit"
            >
                ⌫
            </button>
        </div>
        <div>
            <input
                type="text"
                name="notes"
                class="form-control form-control-lg shadow-sm"
                placeholder="Add a note..."
                value="{{.Expense.Notes}}"
            />
        </div>
    </div>
</form>
{{end}}
