<!DOCTYPE html>
<html lang="en">

{{template "head" "Login - Expense Tracker"}}

<body class="bg-light d-flex align-items-center justify-content-center"
    style="min-height: 100vh; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card border-0 shadow-lg p-4" style="border-radius: 16px;">
                    <div class="card-body text-center">
                        <div class="mb-4">
                            <!-- Premium icon badge -->
                            <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-gradient text-white rounded-circle mb-3"
                                style="width: 60px; height: 60px;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
                                    class="bi bi-wallet2" viewBox="0 0 16 16">
                                    <path
                                        d="M12.136.326A1.5 1.5 0 0 1 14 1.78V3h.5A1.5 1.5 0 0 1 16 4.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 13.5v-9a1.5 1.5 0 0 1 1.432-1.499L12.136.326zM5.562 3H13V1.78a.5.5 0 0 0-.621-.484L5.562 3zM1.5 4a.5.5 0 0 0-.5.5v9a.5.5 0 0 0 .5.5h13a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-13z" />
                                </svg>
                            </div>
                            <h2 class="fw-bold text-dark">Welcome Back</h2>
                            <p class="text-muted small">Track your expenses effortlessly</p>
                        </div>
                        <!-- Error message container (if redirected with error query parameter) -->
                        {{if .Error}}
                        <div class="alert alert-danger py-2 px-3 small border-0 mb-3" style="border-radius: 8px;">
                            {{.Error}}
                        </div>
                        {{end}}
                        <div class="d-grid gap-2">
                            <!-- Sign in with Google Button -->
                            <a href="/auth/google"
                                class="btn btn-outline-dark py-2.5 d-flex align-items-center justify-content-center gap-2 fw-semibold"
                                style="border-radius: 10px; border-color: #dee2e6; background-color: #ffffff; transition: all 0.2s ease;">
                                <!-- Google SVG Logo -->
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
                                    <path fill="#EA4335"
                                        d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                                    <path fill="#4285F4"
                                        d="M46.5 24c0-1.55-.15-3.24-.47-4.77H24v9.03h12.75c-.55 2.87-2.18 5.3-4.63 6.93l7.2 5.58C43.5 36.24 46.5 30.73 46.5 24z" />
                                    <path fill="#FBBC05"
                                        d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.98-6.19z" />
                                    <path fill="#34A853"
                                        d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.2-5.58c-2.11 1.41-4.8 2.29-8.69 2.29-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                                </svg>
                                Sign in with Google
                            </a>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-4 text-muted small">
                    &copy; 2026 Expense Tracker. All rights reserved.
                </div>
            </div>
        </div>
    </div>
</body>

</html>
