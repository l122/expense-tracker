name: Go

on:
  push:
    branches: [ "git-actions" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6.3.0
      with:
        go-version-file: 'go.mod'

    - name: Display Go version
      run: go version

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
