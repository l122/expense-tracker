{{define "user"}}


<div class="card" style="width: 18rem;">
    <img src="{{.AvatarUrl}}" class="card-img-top" alt="Avatar">
    <div class="card-body">
        <h5 class="card-title">{{.FullName}}</h5>
        <p class="card-text">{{.Email}}</p>
    </div>
    <div class="card-body">
        <a href="/user/{{.Id}}" class="card-link" hx-delete="/user/{{.Id}}">Delete</a>
        <a href="/auth/logout" class="card-link">Logout</a>
    </div>
</div>
{{end}}
