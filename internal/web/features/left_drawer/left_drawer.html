{{define "left_drawer"}}
<!-- Bootstrap Offcanvas Trigger -->
<button class="menu-toggle border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu"
    aria-controls="offcanvasMenu">
    <svg xmlns="http://www.w3.org/2000/svg" width="2.5em" height="2.5em" fill="currentColor" class="bi bi-list"
        viewBox="0 0 16 16">
        <path fill-rule="evenodd"
            d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5" />
    </svg>
</button>

<!-- Bootstrap Offcanvas Menu -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasMenu" aria-labelledby="offcanvasMenuLabel">
    <div class="offcanvas-header border-bottom">
        <h2 class="offcanvas-title h1" id="offcanvasMenuLabel">Menu</h2>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">

        <ul class="nav flex-column">

            <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/dashboard" hx-get="/dashboard"
                    hx-target="#main_page" hx-trigger="load, click" data-bs-dismiss="offcanvas">Dashboard</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" hx-get="/about" href="/about" hx-target="#main_page"
                    data-bs-dismiss="offcanvas">About</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" hx-get="/admin" href="/admin" hx-target="#main_page"
                    data-bs-dismiss="offcanvas">Admin</a>
            </li>

        </ul>
    </div>
</div>
{{end}}
