{{define "expense"}}
<style>
    #sandwich_menu {
        display: none !important;
    }
</style>
<div class="container py-3" style="max-width: 480px;">
    <!-- Top Header with Back Button -->
    <div class="d-flex align-items-center justify-content-between mb-3">
        {{template "return-button"}}
        <h5 class="mb-0 fw-semibold">
            {{if .Expense.Id}}Edit expense{{else}}New expense{{end}}
        </h5>
        <div style="width: 24px;"></div>
    </div>

    <form id="expense-form">
        {{if .Expense.Id}}
        <input type="hidden" name="id" value="{{.Expense.Id}}">
        {{end}}
        <input type="hidden" id="expense_date_iso" name="expense_date" value="{{if not .Expense.ExpenseDate.IsZero}}{{.Expense.ExpenseDate.Format "2006-01-02"}}{{end}}">

        <!-- Reused Date Picker Template -->
        {{template "date-picker"}}

        <!-- Amount Row: Currency + Integer Input + Backspace Button -->
        <div class="input-group input-group-lg mb-3 shadow-sm">
            <span class="input-group-text bg-white fw-bold text-muted border-end-0">USD</span>
            <input
                type="text"
                inputmode="numeric"
                id="amount-input"
                name="amount"
                class="form-control text-end fw-bold fs-3 border-start-0 border-end-0 bg-white"
                placeholder="0"
                value="{{if .Expense.Amount}}{{printf "%.0f" .Expense.Amount}}{{end}}"
                readonly
            >
            <button
                type="button"
                id="backspace-btn"
                class="btn btn-outline-secondary border-start-0 bg-white text-dark"
                aria-label="Erase last digit"
            >
                &#9003;
            </button>
        </div>

        <!-- Note Input -->
        <div class="mb-4">
            <input
                type="text"
                name="notes"
                class="form-control form-control-lg"
                placeholder="Add a note..."
                value="{{.Expense.Notes}}"
            >
        </div>

        <!-- Reused Calculator Template -->
        {{template "calculator"}}

        <!-- Wide Bottom Action Button -->
        <div class="d-grid">
            <button
                type="button"
                class="btn btn-primary btn-lg py-3 fw-semibold"
                hx-post="/expenses/select-category"
                hx-include="#expense-form"
                hx-target="#main_page"
            >
                Choose category
            </button>
        </div>
    </form>
</div>

<script>
(function() {
    // 1. Date Picker & Formatting Logic
    const dateInput = document.getElementById('native-date-picker');
    const dateBtn = document.getElementById('date-display-btn');
    const hiddenIso = document.getElementById('expense_date_iso');

    function formatDisplayDate(dateObj) {
        const weekday = dateObj.toLocaleDateString('en-US', { weekday: 'long' });
        const day = dateObj.getDate();
        const month = dateObj.toLocaleDateString('en-US', { month: 'long' });
        return `${weekday}, ${day} ${month}`;
    }

    function toIsoDate(dateObj) {
        const offset = dateObj.getTimezoneOffset();
        const local = new Date(dateObj.getTime() - (offset * 60 * 1000));
        return local.toISOString().split('T')[0];
    }

    let initialDate = hiddenIso.value ? new Date(hiddenIso.value + 'T00:00:00') : new Date();
    dateInput.value = toIsoDate(initialDate);
    hiddenIso.value = dateInput.value;
    dateBtn.textContent = formatDisplayDate(initialDate);

    dateInput.addEventListener('change', function() {
        if (!this.value) return;
        const selected = new Date(this.value + 'T00:00:00');
        hiddenIso.value = this.value;
        dateBtn.textContent = formatDisplayDate(selected);
    });

    // 2. Calculator & Amount Logic
    const amountInput = document.getElementById('amount-input');
    const backspaceBtn = document.getElementById('backspace-btn');
    let expression = amountInput.value || '';

    function evaluateExpression(expr) {
        const clean = expr.replace(/[^0-9+\-*/.]/g, '');
        if (!clean) return '';
        try {
            const raw = Function('"use strict";return (' + clean + ')')();
            if (!isFinite(raw) || isNaN(raw)) return '';
            return Math.max(0, Math.round(raw)).toString();
        } catch {
            return expr;
        }
    }

    document.querySelectorAll('.calc-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const val = btn.dataset.val;

            if (val === '=') {
                expression = evaluateExpression(expression);
                amountInput.value = expression;
                return;
            }

            const operators = ['+', '-', '*', '/', '.'];
            const lastChar = expression.slice(-1);
            if (operators.includes(val) && operators.includes(lastChar)) {
                expression = expression.slice(0, -1) + val;
            } else {
                expression += val;
            }

            amountInput.value = expression;
        });
    });

    backspaceBtn.addEventListener('click', () => {
        expression = expression.slice(0, -1);
        amountInput.value = expression;
    });

    document.getElementById('expense-form').addEventListener('htmx:configRequest', (evt) => {
        const resolved = evaluateExpression(expression) || '0';
        evt.detail.parameters['amount'] = resolved;
    });
})();
</script>
{{end}}
