{{define "categoryexpenses"}}
<style>
    #sandwich_menu {
        display: none !important;
    }
</style>
<div id="expense_page" class="container-fluid px-3 px-md-4 pt-5 pb-4 py-md-5">
    <a href="/dashboard"
        class="btn btn-light border-0 position-fixed top-0 start-0 m-2 z-3 rounded-circle p-2 shadow-sm"
        hx-get="/dashboard" hx-target="#main_page" aria-label="Back">
        <svg xmlns="http://www.w3.org/2000/svg" width="1.75em" height="1.75em" fill="currentColor"
            class="bi bi-arrow-left" viewBox="0 0 16 16">
            <path fill-rule="evenodd"
                d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8" />
        </svg>
    </a>

    <div class="text-center mb-4 mb-md-5">
        <h1 class="display-5 fw-bold text-uppercase mb-1">{{.Category.Name}}</h1>
        <p class="fs-2 fw-semibold text-muted mb-0">${{printf "%.2f" .TotalAmount}}</p>
    </div>

    <div class="d-flex flex-column gap-4 pb-5 mb-4">
        {{range .DateGroups}}
        <div>
            <h6 class="text-muted fw-bold mb-2">{{.DateFormatted}}</h6>
            <div class="card shadow-sm border-0">
                <ul class="list-group list-group-flush">
                    {{range .Expenses}}
                    <li class="list-group-item list-group-item-action d-flex justify-content-between align-items-center px-3 px-md-4 py-3"
                        role="button">
                        <div class="me-3 overflow-hidden">
                            <div class="fw-semibold">{{$.Category.Name}}</div>
                            {{if .Notes}}
                            <div class="small text-muted text-truncate">{{.Notes}}</div>
                            {{end}}
                        </div>
                        <span class="fw-bold text-nowrap">${{printf "%.2f" .Amount}}</span>
                    </li>
                    {{end}}
                </ul>
            </div>
        </div>
        {{end}}
    </div>

    <!-- Floating Action Button at Bottom Center -->
    <button type="button"
        class="btn btn-primary position-fixed bottom-0 start-50 translate-middle-x mb-4 z-3 rounded-circle p-3 shadow-lg d-flex align-items-center justify-content-center"
        aria-label="Add Expense">
        <svg xmlns="http://www.w3.org/2000/svg" width="1.75em" height="1.75em" fill="currentColor" class="bi bi-plus-lg"
            viewBox="0 0 16 16">
            <path fill-rule="evenodd"
                d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2" />
        </svg>
    </button>
</div>
{{end}}
