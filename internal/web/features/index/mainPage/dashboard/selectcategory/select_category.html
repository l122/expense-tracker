{{define "selectcategory"}}
<style>
    #sandwich_menu {
        display: none !important;
    }
</style>

<div class="container py-3">
    {{template "return-button" .ReturnUrl}}
    <h5 class="text-center mb-4">Select Category</h5>
    {{if .Categories}}
    <ul class="list-group">
        {{range .Categories}}
        <li class="list-group-item d-flex align-items-center">
            <button
                type="button"
                class="btn btn-sm btn-outline-secondary w-100 text-start"
                hx-post="/category/{{.Id}}/expense/edit"
                hx-include="#category-preserve-form"
                hx-target="#main_page"
                hx-swap="outerHTML"
            >
                {{.Name}}
            </button>
        </li>
        {{end}}
    </ul>
    {{else}}
    <p class="text-center text-muted">No categories found.</p>
    {{end}}
    <form id="category-preserve-form" style="display: none">
        <input type="hidden" name="amount" value="{{.Expense.Amount}}" />
        <input type="hidden" name="notes" value="{{.Expense.Notes}}" />
        <input
            type="hidden"
            name="expense_date"
            value="{{.Expense.ExpenseDate}}"
        />
        <input type="hidden" name="return_url" value="{{.ParentReturnUrl}}" />
    </form>
</div>
{{end}}
