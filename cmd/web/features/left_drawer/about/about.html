{{define "about"}}
<div class="accordion-item">
    <h2 class="accordion-header">
        <button class="accordion-button collapsed fs-2" type="button" data-bs-toggle="collapse"
            data-bs-target="#aboutCollapse">
            About
        </button>
    </h2>
    <div id="aboutCollapse" class="accordion-collapse collapse">
        <div class="accordion-body">
            <div class="card bg-light p-4 border-0">
                <p class="fs-6 mb-2"><strong>Version:</strong> {{.AppVersion}}</p>
                <p class="fs-6 mb-2"><strong>Commit:</strong> {{.CommitSHA}}</p>
                <p class="fs-6 mb-0"><strong>Build:</strong> {{.BuildDate}}</p>
            </div>
        </div>
    </div>
</div>
{{end}}
