{{define "date-picker"}}
<div class="text-center mb-4">
    <div class="position-relative d-inline-block">
        <!-- Visible button that displays the formatted date -->
        <button
            type="button"
            id="date-display-btn"
            class="btn btn-light border rounded-pill px-3 py-1 fw-medium text-secondary"
            onclick="
                const picker = document.getElementById('native-date-picker');
                picker.showPicker ? picker.showPicker() : picker.focus();
            "
        >
            Select Date
        </button>

        <!-- Invisible native date input overlaid directly on the button -->
        <input
            type="date"
            id="native-date-picker"
            class="position-absolute top-0 start-0 w-100 h-100 opacity-0"
            style="pointer-events: none"
        />
    </div>
</div>

<script>
    (function () {
        const picker = document.getElementById("native-date-picker");
        if (picker) {
            const today = new Date();
            // Adjust for local timezone offset so toISOString() gives local YYYY-MM-DD
            today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
            picker.max = today.toISOString().split("T")[0];
        }
    })();
</script>
{{end}}
