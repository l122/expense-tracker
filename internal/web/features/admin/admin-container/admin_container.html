{{define "admin_container"}}
<div class="admin-container py-5">
    <h1 class="display-3 fw-bold mb-5">User Management</h1>
    <table class="table table-striped">
        <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">User Name</th>
                <th scope="col">User Email</th>
                <th scope="col">User ID</th>
                <th scope="col">User Role</th>
                <th scope="col"></th>
            </tr>
        </thead>
        <tbody>
            {{range $index, $user := .}}
            <tr>
                <th scope="row">{{$index}}</th>
                <td>{{$user.Name}}</td>
                <td>{{$user.Email}}</td>
                <td>{{$user.Username}}</td>
                <td>{{$user.Role}}</td>
                <td>
                    <button class="btn btn-danger" hx-delete="/admin/{{$user.Id}}" hx-target="#usersContainer"
                        hx-confirm="Are you sure you want to '{{$user.Username}}'?" hx-indicator="#loadingIndicator">
                        Delete
                    </button>
                    <!-- 
                    {{template "delete_button" .}} -->
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
</div>
{{end}}
