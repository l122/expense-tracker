{{define "new_expense_by_category"}} {{template "new_expense_style"}}
<div class="container py-3 expense-container" style="max-width: 480px">
    <div>
        {{template "return_from_new_expense_section"}} {{template
        "new_expense_form"}}
        <input
            type="hidden"
            name="category_id"
            form="expense-form"
            value="{{.Category.Id}}"
        />
    </div>
    <div class="pb-3">
        {{template "calculator"}}
        <div class="d-grid mt-3">
            {{template "add_to_category_button" .Category.Name}}
        </div>
    </div>
</div>

{{template "expense-scripts"}} {{end}}
