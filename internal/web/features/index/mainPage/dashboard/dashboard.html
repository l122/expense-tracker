{{define "dashboard"}}
<div class="container-fluid px-3 px-md-4 pt-5 pb-4 py-md-5">
    <h1 class="display-5 fw-bold mb-4 mb-md-5">Expense Tracker</h1>
    <div class="card shadow-lg border-0">
        <div class="card-header bg-transparent border-0 pt-4 px-3 px-md-5">
            <h4 class="card-title fw-bold mb-0">Categories</h4>
        </div>
        <div class="card-body p-3 p-md-5">
            {{if .}}
            <div class="table-responsive">
                <table class="table table-striped align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Icon</th>
                            <th scope="col">Name</th>
                            <th scope="col">Color</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{range .}}
                        <tr>
                            <th scope="row">{{.Id}}</th>
                            <td>
                                {{if .Icon}}
                                <span>{{.Icon}}</span>
                                {{else}}
                                <span class="text-muted">-</span>
                                {{end}}
                            </td>
                            <td class="fw-semibold">{{.Name}}</td>
                            <td>
                                {{if .Color}}
                                <span class="badge text-bg-light border">{{.Color}}</span>
                                {{else}}
                                <span class="text-muted">-</span>
                                {{end}}
                            </td>
                        </tr>
                        {{end}}
                    </tbody>
                </table>
            </div>
            {{else}}
            <p class="fs-6 text-muted mb-0">No categories found.</p>
            {{end}}
        </div>
    </div>
</div>
{{end}}
