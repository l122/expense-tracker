{{define "calculator"}}
<div class="row g-2 mb-4" id="calc-grid">
    <!-- Row 1 -->
    <div class="col-3">
        <button
            type="button"
            class="btn btn-light border w-100 py-3 fs-4 fw-semibold calc-btn"
            data-val="1"
        >
            1
        </button>
    </div>
    <div class="col-3">
        <button
            type="button"
            class="btn btn-light border w-100 py-3 fs-4 fw-semibold calc-btn"
            data-val="2"
        >
            2
        </button>
    </div>
    <div class="col-3">
        <button
            type="button"
            class="btn btn-light border w-100 py-3 fs-4 fw-semibold calc-btn"
            data-val="3"
        >
            3
        </button>
    </div>
    <div class="col-3">
        <button
            type="button"
            class="btn btn-secondary-subtle border w-100 py-3 fs-4 fw-semibold calc-btn"
            data-val="+"
        >
            +
        </button>
    </div>

    <!-- Row 2 -->
    <div class="col-3">
        <button
            type="button"
            class="btn btn-light border w-100 py-3 fs-4 fw-semibold calc-btn"
            data-val="4"
        >
            4
        </button>
    </div>
    <div class="col-3">
        <button
            type="button"
            class="btn btn-light border w-100 py-3 fs-4 fw-semibold calc-btn"
            data-val="5"
        >
            5
        </button>
    </div>
    <div class="col-3">
        <button
            type="button"
            class="btn btn-light border w-100 py-3 fs-4 fw-semibold calc-btn"
            data-val="6"
        >
            6
        </button>
    </div>
    <div class="col-3">
        <button
            type="button"
            class="btn btn-secondary-subtle border w-100 py-3 fs-4 fw-semibold calc-btn"
            data-val="-"
        >
            &minus;
        </button>
    </div>

    <!-- Row 3 -->
    <div class="col-3">
        <button
            type="button"
            class="btn btn-light border w-100 py-3 fs-4 fw-semibold calc-btn"
            data-val="7"
        >
            7
        </button>
    </div>
    <div class="col-3">
        <button
            type="button"
            class="btn btn-light border w-100 py-3 fs-4 fw-semibold calc-btn"
            data-val="8"
        >
            8
        </button>
    </div>
    <div class="col-3">
        <button
            type="button"
            class="btn btn-light border w-100 py-3 fs-4 fw-semibold calc-btn"
            data-val="9"
        >
            9
        </button>
    </div>
    <div class="col-3">
        <button
            type="button"
            class="btn btn-secondary-subtle border w-100 py-3 fs-4 fw-semibold calc-btn"
            data-val="*"
        >
            &times;
        </button>
    </div>

    <!-- Row 4 -->
    <div class="col-3">
        <button
            type="button"
            class="btn btn-light border w-100 py-3 fs-4 fw-semibold calc-btn"
            data-val="."
        >
            .
        </button>
    </div>
    <div class="col-3">
        <button
            type="button"
            class="btn btn-light border w-100 py-3 fs-4 fw-semibold calc-btn"
            data-val="0"
        >
            0
        </button>
    </div>
    <div class="col-3">
        <button
            type="button"
            class="btn btn-primary-subtle border w-100 py-3 fs-4 fw-semibold calc-btn"
            data-val="="
        >
            =
        </button>
    </div>
    <div class="col-3">
        <button
            type="button"
            class="btn btn-secondary-subtle border w-100 py-3 fs-4 fw-semibold calc-btn"
            data-val="/"
        >
            &divide;
        </button>
    </div>
</div>
{{end}}
