{{define "dashboard"}}

<div class="text-center mt-2">
    <p class="fs-2 fw-semibold text-muted mb-0">
        ${{printf "%.2f" .TotalAmount}}
    </p>
</div>

<div class="container-fluid px-3 px-md-4 pt-2 pb-4 py-md-5">
    <div class="card shadow-lg border-0">
        <div class="card-body p-3 pt-0 pb-0 p-md-4">
            {{if .Categories}}
            <ul class="list-group list-group-flush">
                {{range .Categories}}
                <li
                    class="list-group-item list-group-item-action d-flex justify-content-between align-items-center px-2 py-3"
                    role="button"
                    hx-get="/category/{{.Category.Id}}/expenses"
                    hx-target="#main_page"
                    hx-indicator="#loading-indicator"
                >
                    <div class="d-flex align-items-center gap-3">
                        <span class="fw-semibold">{{.Category.Name}}</span>
                    </div>
                    <span class="fw-bold text-nowrap"
                        >${{printf "%.2f" .Amount}}</span
                    >
                </li>
                {{end}}
            </ul>
            {{end}}
        </div>
    </div>
</div>
{{end}}
